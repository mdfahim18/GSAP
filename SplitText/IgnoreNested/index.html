<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ignore Nested/</title>
  </head>

  <style>
    html,
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    h2 {
      opacity: 0;
    }

    .container {
      position: relative;
      width: 90vw;
      display: flex;
      flex-direction: column;
      align-items: center;
      border-radius: 9px;
    }

    .line {
      overflow: hidden;
    }

    .word {
      border: 1.5px dashed white;
      background: linear-gradient(to right, #ff6a00, #ee0979);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;

      min-height: 50px;
      padding: 1rem;
      border-radius: 10px;
      margin: 0.25rem;
    }

    /*   style added to align boxes for styling purposes - not necessary for */
    sup {
      line-height: 0;
    }
  </style>
  <body>
    <div class="container">
      <h2>Split with ignored<sup>1</sup> nested element<sup>&trade;</sup></h2>
    </div>

    <script src="./gsap.min.js"></script>
    <script src="./SplitText.min.js"></script>

    <script>
      gsap.registerPlugin(SplitText);

      document.fonts.ready.then(() => {
        gsap.set('h2', { opacity: 1 });

        const headlineSplit = SplitText.create('h2', {
          type: 'words',
          wordClass: 'word++',
          ignore: 'sup',
        });

        gsap.from(headlineSplit.words, {
          y: -100,
          opacity: 0,
          rotation: 'random(-80, 80)',
          stagger: 0.1,
          duration: 1,
          ease: 'back',
        });
      });
    </script>
  </body>
</html>
