<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Horizontal Text</title>
  </head>

  <style>
    .Horizontal {
      overflow: hidden;
      height: 999px;
      display: flex;
      align-items: center;
    }

    .Horizontal__text {
      display: flex;
      width: max-content;
      white-space: nowrap;
      gap: 4vw;
      padding-left: 100vw;
    }

    .heading-xl {
      font-size: clamp(2rem, 10vw, 12rem);
      font-weight: 600;
      line-height: 1.1;
    }
  </style>
  <body>
    <section class="Horizontal">
      <div class="container">
        <h3 class="Horizontal__text heading-xl">
          The containerAnimation property allows us to create ScrollTriggered
          animations within a container that's animated horizontally. It's like
          having nested ScrollTriggers!
        </h3>
      </div>
    </section>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.10.4/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.10.4/ScrollTrigger.min.js"></script>

    <script>
      gsap.registerPlugin(ScrollTrigger);

      let wrapper = document.querySelector('.Horizontal');
      let text = document.querySelector('.Horizontal__text');

      // Fix spaces
      let letters = text.innerText.split('');
      text.innerHTML = letters
        .map((l) => (l === ' ' ? `<span>&nbsp;</span>` : `<span>${l}</span>`))
        .join('');

      let chars = document.querySelectorAll('.Horizontal__text span');

      // Correct horizontal scroll
      const scrollTween = gsap.to(text, {
        x: () => -(text.scrollWidth - window.innerWidth),
        ease: 'none',
        scrollTrigger: {
          trigger: wrapper,
          pin: true,
          end: () => '+=' + text.scrollWidth,
          scrub: true,
        },
      });

      // Character animation
      chars.forEach((char) => {
        gsap.from(char, {
          yPercent: () => gsap.utils.random(-200, 200),
          rotation: () => gsap.utils.random(-20, 20),
          ease: 'back.out(1.2)',
          scrollTrigger: {
            trigger: char,
            containerAnimation: scrollTween,
            start: 'left 100%',
            end: 'left 30%',
            scrub: 1,
          },
        });
      });
    </script>
  </body>
</html>
