<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <style></style>
  <body>
    <h1 id="text">Hello World</h1>
    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/gsap.min.js"
      integrity="sha512-NcZdtrT77bJr4STcmsGAESr06BYGE8woZdSdEgqnpyqac7sugNO+Tr4bGwGF3MsnEkGKhU2KL2xh6Ec+BqsaHA=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    ></script>
    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/SplitText.min.js"
      integrity="sha512-wOeEC+9qERAzhliwBFPDb6t8TiFFxdxG8vhK/Ygs7TuC44bpg8pg/X2/U/u+0X4fK05wb9id1EIipnF02+CFQw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    ></script>

    <script>
      const texts = [
        'Hello, I am learning GSAP.',
        'Hello, I am learning JavaScript.',
        'Hello, I am building plugins.',
      ];

      let index = 0;

      function animateText() {
        const el = document.querySelector('#text');
        el.textContent = texts[index];
        let split = SplitText.create('#text', {
          type: 'chars',
        });

        gsap.fromTo(
          split.chars,
          { opacity: 0 },
          {
            opacity: 1,
            stagger: 0.05,
            duration: 0.05,
            ease: 'none',
            onComplete: () => {
              setTimeout(() => {
                split.revert();
                index = (index + 1) % texts.length;
                console.log(index);
                document.querySelector('#text').textContent = texts[index];
                animateText();
              }, 1000);
            },
          }
        );

        console.log(split.chars);
      }
      animateText();
    </script>
  </body>
</html>
