<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pin</title>
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
      }
      body {
        overflow-x: hidden;
      }
      #page1 {
        height: 100vh;
        width: 100%;
        background-color: black;
      }
      #page2 {
        height: 100vh;
        width: 100%;
        background-color: lightblue;
        display: flex;
        justify-content: center;
        align-items: center;
      }
      #page3 {
        height: 100vh;
        width: 100%;
        background-color: black;
      }

      #page2 h1 {
        font-size: 40vw;

        /* transform: translateX(-190%); */
      }
    </style>
  </head>
  <body>
    <section id="page1"></section>
    <section id="page2">
      <h1>EXPERIENCES</h1>
    </section>
    <section id="page3"></section>

    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/gsap.min.js"
      integrity="sha512-NcZdtrT77bJr4STcmsGAESr06BYGE8woZdSdEgqnpyqac7sugNO+Tr4bGwGF3MsnEkGKhU2KL2xh6Ec+BqsaHA=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    ></script>
    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/ScrollTrigger.min.js"
      integrity="sha512-P2IDYZfqSwjcSjX0BKeNhwRUH8zRPGlgcWl5n6gBLzdi4Y5/0O4zaXrtO4K9TZK6Hn1BenYpKowuCavNandERg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    ></script>

    <script>
      gsap.to('#page2 h1', {
        xPercent: -150,
        ease: 'none',
        scrollTrigger: {
          trigger: '#page2',
          markers: true,
          start: 'top top',
          end: '+=150%',
          pin: true,
          scrub: 2,
        },
      });
    </script>
  </body>
</html>
